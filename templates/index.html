<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Text Toolkit</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        textarea { width: 100%; height: 150px; padding: 10px; box-sizing: border-box; font-size: 16px; }
        .btn-group { margin: 15px 0; }
        button { padding: 10px 15px; margin-right: 5px; margin-bottom: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .stats { background: #f4f4f4; padding: 10px; border-radius: 4px; margin-bottom: 15px; }
        .result { background: #e9ecef; padding: 15px; border-radius: 4px; border-left: 5px solid #007bff; }
    </style>
</head>
<body>
    <h2>Quick Text Toolkit</h2>
    <form method="POST">
        <textarea name="text_input" placeholder="Paste or type your text here...">{{ original_text }}</textarea>
        
        <div class="btn-group">
            <button type="submit" name="action" value="uppercase">UPPERCASE</button>
            <button type="submit" name="action" value="lowercase">lowercase</button>
            <button type="submit" name="action" value="titlecase">Title Case</button>
            <button type="submit" name="action" value="clean_spaces">Remove Extra Spaces</button>
        </div>
    </form>

    {% if original_text %}
    <div class="stats">
        <strong>Words:</strong> {{ word_count }} | <strong>Characters:</strong> {{ char_count }}
    </div>

    <h3>Processed Output</h3>
    <div class="result">
        <p>{{ processed_text }}</p>
    </div>
    {% endif %}
</body>
</html>
