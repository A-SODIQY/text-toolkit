<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converter - Quick Text Toolkit</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 0 0 70px 0; 
            text-align: center; 
        }
        
        .navbar { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            background: #1a1a1a; 
            padding: 12px 10px; 
            border-bottom: 1px solid #333; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        .navbar a { color: #cccccc; text-decoration: none; font-size: 14px; font-weight: bold; }
        .navbar a:hover, .navbar a.active { color: #ffffff; }

        .container { 
            max-width: 600px; 
            margin: 20px auto; 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        h1 { color: #ffffff; margin-bottom: 5px; font-size: 22px; }
        p { color: #bbb; font-size: 14px; }

        textarea {
            width: 100%;
            height: 120px;
            background: #2a2a2a;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            font-size: 15px;
            margin-top: 10px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button { 
            flex: 1;
            padding: 12px; 
            border-radius: 6px; 
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            border: none; 
            background: #3182ce; 
            color: white; 
        }
        button:hover { background: #2b6cb0; }

        .result-box {
            margin-top: 20px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            border-left: 5px solid #3182ce;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
        }
        .bottom-nav a {
            color: #888888;
            text-decoration: none;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .bottom-nav a.active { color: #3182ce; }
        .bottom-nav .icon { font-size: 18px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/">🏠 Home</a>
        <a href="/case-converter" class="active">🔤 Case Converter</a>
        <a href="/whatsapp">💬 WhatsApp Generator</a>
        <a href="/what-to-watch">🎬 What to Watch</a>
    </nav>

    <div class="container">
        <h1>🔤 Text Case Converter</h1>
        <p>Easily transform your text into UPPERCASE, lowercase, or Title Case.</p>

        <form method="POST" action="/case-converter">
            <textarea name="text" placeholder="Type or paste your text here..." required>{{ original_text or '' }}</textarea>
            
            <div class="btn-group">
                <button type="submit" name="type" value="uppercase">UPPERCASE</button>
                <button type="submit" name="type" value="lowercase">lowercase</button>
                <button type="submit" name="type" value="titlecase">Title Case</button>
            </div>
        </form>

        {% if converted_text %}
        <div class="result-box">
            <strong>Converted Result:</strong>
            <p style="margin-top: 8px; font-size: 16px; color: #fff;">{{ converted_text }}</p>
        </div>
        {% endif %}
    </div>

    <nav class="bottom-nav">
        <a href="/">
            <span class="icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="/case-converter" class="active">
            <span class="icon">🔤</span>
            <span>Converter</span>
        </a>
        <a href="/whatsapp">
            <span class="icon">💬</span>
            <span>WhatsApp</span>
        </a>
        <a href="/what-to-watch">
            <span class="icon">🎬</span>
            <span>Movies</span>
        </a>
    </nav>

</body>
</html>
